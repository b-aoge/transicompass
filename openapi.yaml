openapi: 3.0.3

info:
  title: 转型罗盘 TranSiCompass API
  version: 1.0.0
  description: |
    工程人转型决策工具的后端契约。前端据此生成 TypeScript 类型与 Mock，后端据此实现。

    约定：
    - 业务错误一律返回 HTTP 200 + 非 0 `code`（规避微信内置浏览器与企业网络对 4xx/5xx 的拦截改写）。
      仅网关级失败（限流、超大 body）返回真实 4xx/5xx。
    - 服务端不存在任何接收 multipart/form-data 的端点。简历解析与 PII 脱敏在客户端完成，
      仅上送 sanitized_text。这是合规硬约束，见 Spec 8.5。
    - 所有诊断数据默认 30 天自动清除；分享链接 7 天有效。

  contact:
    name: 架构负责人 高见远
  license:
    name: Proprietary

servers:
  - url: https://{host}/api/v1
    description: 生产
    variables:
      host:
        default: transicompass.example.cn
  - url: http://localhost:3000/api/v1
    description: 本地开发

tags:
  - name: diagnosis
    description: 诊断生成
  - name: result
    description: 结果读取、保存、导出、分享
  - name: privacy
    description: 数据删除
  - name: conversion
    description: CTA 留资
  - name: auth
    description: 手机验证码轻登录
  - name: telemetry
    description: 埋点与降级订阅

security:
  - sessionCookie: []

paths:

  /diagnosis:
    post:
      tags: [diagnosis]
      operationId: createDiagnosis
      summary: 生成诊断（SSE 流式）
      description: |
        接收客户端脱敏后的文本，两阶段调用大模型生成结构化诊断结果。
        响应为 text/event-stream，事件序列：
        accepted -> progress* -> skills -> progress* -> matches -> path -> done
        失败时以 failed 事件结束。
        限流：同一 sid 5 次/小时；同一 IP 20 次/小时（IP 仅内存计数，不落盘）。
      security:
        - sessionCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisRequest'
      responses:
        '200':
          description: SSE 流
          headers:
            Set-Cookie:
              description: 首次访问时下发匿名会话 sid
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: 典型事件序列
                  value: |
                    event: accepted
                    data: {"result_id":"3f2a...","session_id":"91bc..."}

                    event: progress
                    data: {"stage":"extracting","percent":15}

                    event: skills
                    data: {"transferable_skills":[...]}

                    event: progress
                    data: {"stage":"matching","percent":60}

                    event: matches
                    data: {"track_matches":[...],"top_gaps":[...]}

                    event: path
                    data: {"learning_path":[...],"rewrite_samples":[...]}

                    event: done
                    data: {"result_id":"3f2a...","status":"completed","out_of_scope":false}
        '429':
          $ref: '#/components/responses/RateLimited'

  /results:
    post:
      tags: [result]
      operationId: saveResult
      summary: 保存结果（触发轻登录）
      description: 将结果与已登录用户绑定，实现「先看结果、后登录认领」。
      security:
        - jwtCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id]
              properties:
                result_id: { type: string, format: uuid }
                title:
                  type: string
                  maxLength: 40
                  description: 可选；缺省由服务端按 Top1 赛道生成
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          result_id: { type: string, format: uuid }
                          saved_at: { type: string, format: date-time }
                          expires_at: { type: string, format: date-time }

  /results/{id}:
    get:
      tags: [result]
      operationId: getResult
      summary: 读取结果（本人 / 已登录 / 分享令牌 三选一）
      security:
        - sessionCookie: []
        - jwtCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: share_token
          in: query
          required: false
          description: 只读分享场景传入；命中时 view_mode 为 shared，服务端强制剥离敏感字段
          schema: { type: string, minLength: 32, maxLength: 32 }
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResultView'

  /export:
    post:
      tags: [result]
      operationId: exportResult
      summary: 生成 PDF 导出
      description: |
        服务端 Playwright 渲染 /r/{id}/print 版式并输出 PDF，结果不落盘。
        失败时前端降级为浏览器打印。限流 10 次/小时/用户。
      security:
        - jwtCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id, format]
              properties:
                result_id: { type: string, format: uuid }
                format: { type: string, enum: [pdf] }
      responses:
        '200':
          description: PDF 二进制流
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="转型罗盘诊断报告_20260803.pdf"
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              description: 失败时返回统一错误信封（9000）

  /share:
    post:
      tags: [result]
      operationId: createShare
      summary: 生成 7 天只读分享链接
      description: 同一 result_id 重复调用时复用未过期 token，避免链接扩散失控。
      security:
        - jwtCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id]
              properties:
                result_id: { type: string, format: uuid }
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          share_token: { type: string, minLength: 32, maxLength: 32 }
                          share_url: { type: string, format: uri }
                          expires_at: { type: string, format: date-time }

  /data:
    delete:
      tags: [privacy]
      operationId: deleteMyData
      summary: 即时删除用户数据
      description: |
        同步物理删除（非软删）。scope=session 删除本次会话及其结果与分享；
        scope=all 需 JWT，删除该用户全部数据与账号。
        leads（主动留资）不在删除范围内，响应中显式告知并提供人工通道。
      security:
        - sessionCookie: []
        - jwtCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                scope: { type: string, enum: [session, all], default: session }
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          scope: { type: string, enum: [session, all] }
                          deleted_at: { type: string, format: date-time }
                          deleted:
                            type: object
                            properties:
                              sessions: { type: integer }
                              results: { type: integer }
                              shares: { type: integer }
                              events: { type: integer }
                          retained:
                            type: object
                            properties:
                              leads: { type: integer }
                              reason: { type: string }

  /lead:
    post:
      tags: [conversion]
      operationId: submitLead
      summary: CTA 留资（社群 / 1v1 解读）
      description: 刻意不要求登录——留资本身即转化动作，加登录会砍掉转化。限流 3 次/小时/sid。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadRequest'
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          lead_id: { type: string, format: uuid }
                          cta_type: { $ref: '#/components/schemas/CtaType' }
                          next_action:
                            type: object
                            properties:
                              type: { type: string, enum: [qrcode, queue] }
                              value: { type: string }
                              hint: { type: string }
                              queue_position: { type: integer, nullable: true }
                              eta_hours: { type: integer, nullable: true }

  /auth/code:
    post:
      tags: [auth]
      operationId: sendAuthCode
      summary: 发送手机验证码
      description: 限流：同手机号 1 次/60s、5 次/天；同 sid 10 次/天。响应不回显验证码。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, scene]
              properties:
                phone: { type: string, pattern: '^1[3-9]\d{9}$' }
                scene: { type: string, enum: [save, export, share] }
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          sent: { type: boolean }
                          resend_after: { type: integer, description: 秒 }

  /auth/verify:
    post:
      tags: [auth]
      operationId: verifyAuthCode
      summary: 校验验证码并签发 JWT
      description: 连续错误 5 次锁定 15 分钟。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, pattern: '^1[3-9]\d{9}$' }
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: 统一响应
          headers:
            Set-Cookie:
              description: token（JWT HS256, httpOnly, Secure, SameSite=Lax, 7d）
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          user_id: { type: string, format: uuid }
                          is_new: { type: boolean }

  /events:
    post:
      tags: [telemetry]
      operationId: reportEvents
      summary: 批量埋点上报
      description: |
        sendBeacon 友好，永远返回 code=0（埋点失败绝不影响主流程）。
        name 不在白名单则静默丢弃；props 按白名单裁剪。
        不采集简历原文、不采集 IP、不采集完整 UA。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: '#/components/schemas/TelemetryEvent' }
                device: { $ref: '#/components/schemas/DeviceType' }
                app_version: { type: string, maxLength: 16 }
      responses:
        '200':
          description: 恒定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'

  /fallback-subscribe:
    post:
      tags: [telemetry]
      operationId: subscribeFallback
      summary: AI 失败降级——留邮箱异步接收结果
      description: 写入 fallback_jobs，Worker 每 5 分钟重试，最多 3 次，成功后邮件推送。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, email]
              properties:
                session_id: { type: string, format: uuid }
                email: { type: string, format: email }
      responses:
        '200':
          description: 统一响应
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          subscribed: { type: boolean }
                          eta_minutes: { type: integer }

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: 匿名会话 Cookie（httpOnly, Secure, SameSite=Lax, 30d），不含实名信息
    jwtCookie:
      type: apiKey
      in: cookie
      name: token
      description: 轻登录 JWT（HS256, httpOnly, Secure, SameSite=Lax, 7d）

  responses:
    RateLimited:
      description: 触发限流
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
            example:
              code: 6001
              data: null
              message: 请求过于频繁，请稍后再试

  schemas:

    ApiEnvelope:
      type: object
      required: [code, data, message]
      properties:
        code:
          type: integer
          description: |
            0 成功
            1001 参数校验失败 / 1002 未勾选隐私授权 / 1003 内容过短或过长 / 1004 与工程行业无关
            2001 未登录 / 2002 验证码错误或过期 / 2003 无权访问
            3001 简历解析失败 / 3002 文件过大或格式不支持
            4001 AI 服务不可用（可降级）/ 4002 AI 输出校验失败 / 4003 检测到提示词注入 / 4004 AI 超时
            5001 分享链接不存在或已过期 / 5002 数据已删除
            6001 限流 / 9000 服务器内部错误
          enum: [0, 1001, 1002, 1003, 1004, 2001, 2002, 2003, 3001, 3002,
                 4001, 4002, 4003, 4004, 5001, 5002, 6001, 9000]
        data:
          nullable: true
        message:
          type: string
          description: 面向用户的中文可读描述，不含技术堆栈信息

    TrackCode:
      type: string
      description: V1 锁定 3 个赛道，模型不得生成枚举外的值
      enum:
        - NEW_ENERGY_STORAGE
        - SMART_CONSTRUCTION_BIM
        - ENGINEERING_B2B_OVERSEAS

    CtaType:
      type: string
      enum: [community, consult_1v1]

    DeviceType:
      type: string
      enum: [mobile, desktop, wechat]

    SanitizeReport:
      type: object
      description: 占位符替换计数，用于合规审计与脱敏效果监控，不含任何原文片段
      required: [name, phone, email, idcard, company, project, url]
      additionalProperties: false
      properties:
        name: { type: integer, minimum: 0 }
        phone: { type: integer, minimum: 0 }
        email: { type: integer, minimum: 0 }
        idcard: { type: integer, minimum: 0 }
        company: { type: integer, minimum: 0 }
        project: { type: integer, minimum: 0 }
        url: { type: integer, minimum: 0 }
        injection_hits: { type: integer, minimum: 0 }

    PrivacyConsent:
      type: object
      required: [accepted, policy_version, accepted_at]
      properties:
        accepted:
          type: boolean
          description: 必须为 true，否则返回 1002 并阻断，不发生任何数据上传
        policy_version: { type: string, example: '2026-08-01' }
        accepted_at: { type: string, format: date-time }

    DiagnosisRequest:
      type: object
      required: [input_type, sanitized_text, sanitize_report, privacy_consent]
      properties:
        input_type:
          type: string
          enum: [resume, form]
        sanitized_text:
          type: string
          minLength: 80
          maxLength: 20000
          description: 已在客户端完成 PII 脱敏的纯文本。服务端会再跑一遍同规则兜底。
          example: 从业 12 年，先后在 [公司A]、[公司B] 担任施工员与项目经理，负责 [项目A] 5 万平米住宅主体施工...
        sanitize_report:
          $ref: '#/components/schemas/SanitizeReport'
        form:
          type: object
          description: input_type=form 时必填
          required: [years_of_experience, main_work, target_direction]
          properties:
            years_of_experience: { type: integer, minimum: 0, maximum: 45 }
            main_work: { type: string, minLength: 20, maxLength: 2000 }
            target_direction:
              type: string
              maxLength: 100
              description: 目标方向；不确定时传「不知道」
        privacy_consent:
          $ref: '#/components/schemas/PrivacyConsent'
        client_meta:
          type: object
          properties:
            device: { $ref: '#/components/schemas/DeviceType' }
            app_version: { type: string, maxLength: 16 }

    Evidence:
      type: object
      description: 可解释性的最小单元。source_snippet 必须逐字出自 sanitized_text，不得改写编造。
      required: [source_snippet, why]
      properties:
        source_snippet: { type: string, minLength: 4, maxLength: 120 }
        why: { type: string, minLength: 8, maxLength: 200 }

    Reason:
      type: object
      description: 赛道匹配的结构化依据三元组，是 PIPL 第 24 条说明权与「推理依据占卡片主体」版式的落地点。
      required: [source_quote, mapped_capability, target_scenario]
      properties:
        source_quote:
          type: string
          minLength: 4
          maxLength: 120
          description: 逐字出自 sanitized_text 的原句片段（卡片主体）
        mapped_capability:
          type: string
          minLength: 4
          maxLength: 60
          description: 该佐证映射到的能力 / 经验点
        target_scenario:
          type: string
          minLength: 8
          maxLength: 120
          description: 在目标赛道中的对应场景

    TransferableSkill:
      type: object
      required: [name, description, strength, source_quote, evidence]
      properties:
        name: { type: string, minLength: 2, maxLength: 24 }
        description: { type: string, minLength: 10, maxLength: 160 }
        strength: { type: string, enum: [high, medium, low] }
        source_quote:
          type: string
          minLength: 4
          maxLength: 120
          description: 逐字出自 sanitized_text 的代表性佐证，作为卡片主体（PIPL 24 可解释性落点）
        evidence:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/Evidence' }

    TrackMatch:
      type: object
      description: reasons 最少 2 条是硬约束——结构上不允许出现「裸奔的百分比」
      required: [track_code, match_score, match_level, reasons, typical_roles, caveat]
      properties:
        track_code: { $ref: '#/components/schemas/TrackCode' }
        match_score: { type: integer, minimum: 0, maximum: 100 }
        match_level: { type: string, enum: [high, medium, low] }
        reasons:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: '#/components/schemas/Reason' }
        typical_roles:
          type: array
          minItems: 3
          maxItems: 6
          items: { type: string, minLength: 2, maxLength: 20 }
        caveat:
          type: string
          minLength: 10
          maxLength: 200
          description: 该方向的风险提醒，用于对冲「伪风口」，是可信度来源

    Gap:
      type: object
      required: [gap_name, why_it_matters, closing_action]
      properties:
        gap_name: { type: string, minLength: 2, maxLength: 24 }
        why_it_matters: { type: string, minLength: 10, maxLength: 200 }
        closing_action:
          type: string
          minLength: 10
          maxLength: 200
          description: 必须是可执行动作，不得写成「多学习」

    PathStage:
      type: object
      required: [stage, deliverable, why_this_deliverable, verifiable_artifact]
      properties:
        stage: { type: string, enum: ['0-1m', '1-3m', '3-6m'] }
        deliverable:
          type: string
          minLength: 10
          maxLength: 120
          description: 必须是能写进简历的具体产出物，禁止写成「学习某某课程」
          example: 独立完成一份 20MW 工商业储能 EPC 项目投标技术方案
        why_this_deliverable: { type: string, minLength: 10, maxLength: 200 }
        verifiable_artifact: { type: string, minLength: 4, maxLength: 80 }

    RewriteSample:
      type: object
      required: [target_track_code, original, rewritten, what_changed]
      properties:
        target_track_code: { $ref: '#/components/schemas/TrackCode' }
        original: { type: string, minLength: 6, maxLength: 200 }
        rewritten: { type: string, minLength: 6, maxLength: 200 }
        what_changed: { type: string, minLength: 6, maxLength: 160 }

    DiagnosisPayload:
      type: object
      required:
        - out_of_scope
        - summary
        - transferable_skills
        - track_matches
        - top_gaps
        - learning_path
        - rewrite_samples
      properties:
        out_of_scope:
          type: boolean
          description: 与三个赛道均无实质关联时为 true，必须给出 reason，禁止编造第四个赛道
        out_of_scope_reason: { type: string, maxLength: 300, nullable: true }
        summary: { type: string, minLength: 20, maxLength: 200 }
        transferable_skills:
          type: array
          minItems: 5
          maxItems: 8
          items: { $ref: '#/components/schemas/TransferableSkill' }
        track_matches:
          type: array
          minItems: 3
          maxItems: 3
          description: 恰好 3 条，track_code 互不相同
          items: { $ref: '#/components/schemas/TrackMatch' }
        top_gaps:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/Gap' }
        learning_path:
          type: array
          minItems: 3
          maxItems: 3
          description: 顺序固定为 0-1m, 1-3m, 3-6m
          items: { $ref: '#/components/schemas/PathStage' }
        rewrite_samples:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/RewriteSample' }

    ResultView:
      type: object
      nullable: true
      required: [result_id, created_at, status, view_mode, payload, model_disclosure, disclaimer]
      properties:
        result_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [completed, degraded] }
        out_of_scope: { type: boolean }
        view_mode:
          type: string
          enum: [owner, shared]
          description: shared 时服务端强制剥离 sanitize_report / session_id / model_meta.raw_usage
        payload: { $ref: '#/components/schemas/DiagnosisPayload' }
        model_disclosure:
          type: object
          description: 合规公示，页面必须渲染（生成式人工智能服务登记要求）
          required: [model_name, registration_no]
          properties:
            model_name: { type: string, example: qwen3.7-plus }
            registration_no: { type: string }
        disclaimer:
          type: string
          example: 本报告为 AI 辅助参考，不构成职业中介服务、就业承诺或投资建议。

    LeadRequest:
      type: object
      required: [cta_type, contact, contact_type, consent]
      properties:
        cta_type: { $ref: '#/components/schemas/CtaType' }
        contact: { type: string, minLength: 5, maxLength: 40 }
        contact_type: { type: string, enum: [phone, wechat] }
        result_id: { type: string, format: uuid, nullable: true }
        source_channel:
          type: string
          maxLength: 20
          nullable: true
          description: 来自 UTM 参数的渠道标识，如 xhs / zhihu / douyin
        consent:
          type: object
          description: 留资是独立的个人信息收集行为，需单独同意
          required: [accepted, policy_version]
          properties:
            accepted: { type: boolean, enum: [true] }
            policy_version: { type: string }

    TelemetryEvent:
      type: object
      required: [name, occurred_at]
      properties:
        name:
          type: string
          description: 命名规范 {对象}_{动作}；白名单之外的事件服务端静默丢弃
          enum:
            - page_view
            - diagnosis_started
            - diagnosis_completed
            - input_abandoned
            - result_exported
            - result_shared
            - cta_clicked
            - lead_submitted
            - ai_call_failed
            - error_occurred
        props:
          type: object
          description: 按白名单裁剪后入库；绝不接受简历原文、IP、完整 UA
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
